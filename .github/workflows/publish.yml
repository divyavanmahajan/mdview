name: Release

# Pushing a tag such as v1.2.3 builds version 1.2.3 (the version is derived
# from the tag), creates the GitHub release and uploads to PyPI.
#
# PyPI upload uses "trusted publishing": on pypi.org add this repository,
# workflow "publish.yml" and environment "pypi" as a trusted publisher for
# the project dvm-mdview. No API token is stored.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv build
      - name: Check that the built version matches the tag
        run: ls "dist/dvm_mdview-${GITHUB_REF_NAME#v}-py3-none-any.whl" "dist/dvm_mdview-${GITHUB_REF_NAME#v}.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv publish
