name: Publish to PyPI

# Runs when a GitHub release is published. Uses PyPI "trusted publishing":
# on pypi.org add this repository and the workflow name "publish.yml" as a
# trusted publisher for the project dvm-mdview. No API token is stored.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - run: uv publish
