[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "dvm-mdview"
dynamic = ["version"]
description = "Markdown viewer and live-preview editor with a graphical UI and a terminal UI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/mdview/web/vendor/LICENSE-*"]
requires-python = ">=3.10"
keywords = ["markdown", "viewer", "editor", "preview", "tui", "gui"]
classifiers = [
    "Environment :: Console",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Text Editors",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "markdown-it-py>=3.0",
    "linkify-it-py>=2.0",
    "mdit-py-plugins>=0.4.1",
    "pygments>=2.17",
    "textual>=3.0",
    "pywebview>=5.3",
]

[project.urls]
Homepage = "https://github.com/divyavanmahajan/mdview"
Issues = "https://github.com/divyavanmahajan/mdview/issues"

[project.scripts]
dvm-mdview = "mdview.cli:main"
mdview = "mdview.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

# The version comes from the git tag (v1.2.3 -> 1.2.3), so tag and PyPI version cannot differ.
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/mdview/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mdview"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
